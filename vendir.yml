apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: helm/security-profiles-operator/charts/security-profiles-operator
    contents:
      - path: .
        git:
          url: https://github.com/kubernetes-sigs/security-profiles-operator
          # renovate: datasource=github-releases depName=kubernetes-sigs/security-profiles-operator
          ref: v1.0.0
        includePaths:
          - deploy/helm/**/*
        newRootPath: deploy/helm
  - path: helm/security-profiles-operator/udica-templates
    contents:
      - path: .
        git:
          url: https://github.com/SELinuxProject/refpolicy
          # renovate: datasource=github-tags depName=SELinuxProject/refpolicy versioning=regex:^RELEASE_(?<major>\d+)_(?<minor>\d+)$
          ref: RELEASE_2_20260616
        includePaths:
          - udica-templates/**/*
        newRootPath: udica-templates
