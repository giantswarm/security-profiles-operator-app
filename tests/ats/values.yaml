# The chart's PolicyExceptions go to the giantswarm namespace, which the
# kind cluster of the chart tests does not have. app-test-suite creates
# policy-exceptions before the install, so the hooks land there.
kyvernoPolicyExceptions:
  namespace: policy-exceptions

# The kind nodes of the chart tests have no SELinux, so the spod daemon cannot
# mount /sys/fs/selinux and /var/lib/selinux and never becomes ready.
security-profiles-operator:
  selinux:
    enable: false
  # The single kind node of the chart tests has 2 CPUs, about half of which the
  # control plane requests. 3 operator and 3 webhook replicas (the webhook pods
  # copy the operator's resources) at 250m each plus spod do not fit
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
