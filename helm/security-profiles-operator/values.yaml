kyvernoPolicyExceptions:
  enabled: true
  # -- Namespace to create the Kyverno PolicyExceptions in. Empty means the release namespace.
  # @default -- The release namespace
  namespace: ""

# @schema skipProperties: true
# @schema additionalProperties: true
# -- Values passed through to the upstream chart. For available options, see the [upstream values.yaml](https://github.com/kubernetes-sigs/security-profiles-operator/blob/v1.1.2/deploy/helm/values.yaml).
# @default -- See [values.yaml](./values.yaml#L17)
security-profiles-operator:
  spoImage:
    registry: gsoci.azurecr.io
    repository: giantswarm/security-profiles-operator
    tag: v1.1.2

  # Only the registry and repository are set here, the tags and digests come
  # from the upstream chart. retagger copies every latest tag these name, so
  # gsoci has the digests upstream pins.
  selinuxdImage:
    # Nodes no OS mapping matches, such as Flatcar and Ubuntu, run the el9
    # image instead of the upstream default image. Renovate keeps the digest at
    # the latest el9 image on gsoci.
    default:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd
      tag: latest
      digest: sha256:cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
    el8:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd-el8
    el9:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd
    fedora:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd-fedora

  enableLogEnricher: true

  selinux:
    enable: true
    customTemplatesConfigMap: udica-templates
    options:
      allowedTypes:
        - kernel_t
        - security_t
      allowedClasses:
        - system

  daemon:
    tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoExecute
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoSchedule
        operator: Exists
      - key: node.cilium.io/agent-not-ready
        effect: NoSchedule
        operator: Exists
      - key: ebs.csi.aws.com/agent-not-ready
        effect: NoExecute
        operator: Exists
