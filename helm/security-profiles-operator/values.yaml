kyvernoPolicyExceptions:
  enabled: true
  namespace: giantswarm
  legacy:
    # -- Render the kyverno.io/v2 PolicyException, which only applies to ClusterPolicies. Turn it off once the cluster runs the CEL policies.
    enabled: true
  cel:
    # -- Render the policies.kyverno.io/v1 PolicyException, which only applies to CEL policies (ValidatingPolicy).
    enabled: true

# @schema skipProperties: true
# @schema additionalProperties: true
# -- Values passed through to the upstream chart. For available options, see the [upstream values.yaml](https://github.com/kubernetes-sigs/security-profiles-operator/blob/v1.1.2/deploy/helm/values.yaml).
# @default -- See [values.yaml](./values.yaml#L17)
security-profiles-operator:
  spoImage:
    registry: gsoci.azurecr.io
    repository: giantswarm/security-profiles-operator
    tag: v1.1.2

  selinuxdImage:
    default:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd
      tag: v0.0.0-cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
      # Clears the upstream digest, which takes precedence over the tag
      digest: ""

  enableLogEnricher: true

  selinux:
    enable: true
    customTemplatesConfigMap: udica-templates
    options:
      allowedTypes:
        - kernel_t
        - security_t
      allowedClasses:
        - system

  daemon:
    tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoExecute
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoSchedule
        operator: Exists
      - key: node.cilium.io/agent-not-ready
        effect: NoSchedule
        operator: Exists
      - key: ebs.csi.aws.com/agent-not-ready
        effect: NoExecute
        operator: Exists
