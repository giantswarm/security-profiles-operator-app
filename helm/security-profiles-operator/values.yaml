kyvernoPolicyExceptions:
  enabled: true
  # -- Namespace to create the Kyverno PolicyExceptions in. Empty means the release namespace.
  # @default -- The release namespace
  namespace: ""

# @schema skipProperties: true
# @schema additionalProperties: true
# -- Values passed through to the upstream chart. For available options, see the [upstream values.yaml](https://github.com/kubernetes-sigs/security-profiles-operator/blob/v1.1.2/deploy/helm/values.yaml).
# @default -- See [values.yaml](./values.yaml#L17)
security-profiles-operator:
  spoImage:
    registry: gsoci.azurecr.io
    repository: giantswarm/security-profiles-operator
    tag: v1.1.2

  selinuxdImage:
    default:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd
      tag: v0.0.0-cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
      # Clears the upstream digest, which takes precedence over the tag
      digest: ""
    # Per-OS images for RHEL, RHCOS and Fedora nodes. retagger copies them by
    # digest, so these keep the digests of the upstream chart. The el9 image
    # is the default image above.
    el8:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd-el8
      tag: v0.0.0-e6e7febc76f5f032d42d35b98cc651354dd14ac5ae7b2a7d7403222788e41e4d
      digest: sha256:e6e7febc76f5f032d42d35b98cc651354dd14ac5ae7b2a7d7403222788e41e4d
    el9:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd
      tag: v0.0.0-cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
      digest: sha256:cddbd306c48ee8d19b8fb07b2acda1ee99cb3f1d9c3988f828d24b4f2de5ad3c
    fedora:
      registry: gsoci.azurecr.io
      repository: giantswarm/selinuxd-fedora
      tag: v0.0.0-a5c36469e66bc44c32fc36d8d23571ed8903430233d32136b6272013a535627d
      digest: sha256:a5c36469e66bc44c32fc36d8d23571ed8903430233d32136b6272013a535627d

  enableLogEnricher: true

  selinux:
    enable: true
    customTemplatesConfigMap: udica-templates
    options:
      allowedTypes:
        - kernel_t
        - security_t
      allowedClasses:
        - system

  daemon:
    tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoExecute
        operator: Exists
      - key: node.kubernetes.io/not-ready
        effect: NoSchedule
        operator: Exists
      - key: node.cilium.io/agent-not-ready
        effect: NoSchedule
        operator: Exists
      - key: ebs.csi.aws.com/agent-not-ready
        effect: NoExecute
        operator: Exists
