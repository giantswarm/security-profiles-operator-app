apiVersion: v1
kind: ConfigMap
metadata:
  name: udica-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "udica-templates/*.cil" }}
  {{ base $path }}: |
    {{- toString $content | replace "\t" "  " | nindent 4 }}
  {{- end }}
